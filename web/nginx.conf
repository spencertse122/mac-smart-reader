# Cache policy by path. One add_header at server level (not per location) so the security headers are not dropped.
map $uri $cache_control {
  ~^/assets/        "public, max-age=31536000, immutable";
  ~^/index\.html$   "no-cache";
  default           "";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  types {
    text/html html;
    text/css css;
    text/javascript js mjs;
    application/json json;
    application/manifest+json webmanifest;
    image/png png;
    image/svg+xml svg;
    image/x-icon ico;
    font/woff2 woff2;
    application/wasm wasm;
    text/plain txt;
  }
  default_type application/octet-stream;

  add_header Content-Security-Policy "default-src 'self' blob: data:; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' blob: https://accounts.google.com/gsi/style; img-src 'self' blob: data: https://*.googleusercontent.com; font-src 'self' blob: data:; worker-src 'self' blob:; frame-src 'self' blob: https://accounts.google.com; connect-src 'self' blob: data: https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control $cache_control always;

  # Client-side routes fall back to the app shell; a missing asset is still a 404.
  location / {
    try_files $uri /index.html;
  }
  location ~ \.[A-Za-z0-9]+$ {
    try_files $uri =404;
  }
}

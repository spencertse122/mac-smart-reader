name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # spawn-helper's exec bit is set by the electron-builder afterPack hook (scripts/after-pack.cjs)
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify the ad-hoc code signatures
        run: |
          for app in release/mac-arm64/*.app release/mac/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'
          done
      - name: Check the x64 bundle's architectures
        run: |
          X64="$(ls -d release/mac/*.app)"
          PTY="$X64/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-x64"
          lipo -archs "$X64/Contents/MacOS/Smart Reader" | grep -qw x86_64
          lipo -archs "$PTY/pty.node" | grep -qw x86_64
          lipo -archs "$PTY/spawn-helper" | grep -qw x86_64
          test -x "$PTY/spawn-helper"
      - name: Check the dictionary helper in both bundles
        run: |
          for app in release/mac-arm64/*.app release/mac/*.app; do
            H="$app/Contents/Resources/bin/dict-lookup"
            test -x "$H"
            ARCHS="$(lipo -archs "$H")"
            echo "$H: $ARCHS"
            grep -qw arm64 <<<"$ARCHS"
            grep -qw x86_64 <<<"$ARCHS"
            codesign --verify --verbose=2 "$H"
          done
          # No dictionary assets on the runner is only a warning (exit 1); a crash or usage error (>=2) fails.
          H="$(ls -d release/mac-arm64/*.app)/Contents/Resources/bin/dict-lookup"
          set +e
          OUT="$("$H" serendipity)"
          CODE=$?
          set -e
          echo "dict-lookup serendipity -> exit $CODE: ${OUT:0:200}"
          if [[ $CODE -eq 1 ]]; then echo "::warning::dict-lookup found no definition (no dictionary assets on this runner?)"; fi
          if [[ $CODE -ge 2 ]]; then exit 1; fi
      - name: Smoke-launch the packaged arm64 app
        run: |
          APP_BIN="$(ls -d release/mac-arm64/*.app)/Contents/MacOS/Smart Reader"
          SR_APP_PATH="$APP_BIN" SR_EXPECT_ARCH=arm64 npx playwright test tests/e2e/smoke.spec.ts tests/e2e/packaged.spec.ts
      - name: Install Rosetta 2
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Smoke-launch the packaged x64 app under Rosetta
        run: |
          APP_BIN="$(ls -d release/mac/*.app)/Contents/MacOS/Smart Reader"
          SR_APP_PATH="$APP_BIN" SR_EXPECT_ARCH=x64 npx playwright test tests/e2e/smoke.spec.ts tests/e2e/packaged.spec.ts
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then TAG="v$(node -p "require('./package.json').version")"; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Smart Reader $TAG" --notes "Install or update: see README."
          gh release upload "$TAG" release/*.dmg --clobber
